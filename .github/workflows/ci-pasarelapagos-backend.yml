name: CI — pasarelapagos-backend

on:
  push:
    branches: [main]
    paths:
      - 'pasarelapagos-backend/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - 'pasarelapagos-backend/**'
      - 'packages/**'

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # prisma generate (parte de typecheck/build) exige DATABASE_URL aunque no conecte
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: '10' }

      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      # ── Packages compartidos → dist (ADR-020: servicios consumen dist, no src)
      - name: Build packages
        run: pnpm build:packages

      # ── Calidad ────────────────────────────────────────────────────────────
      - name: Lint
        run: pnpm --filter=pasarelapagos-backend lint

      - name: Typecheck
        run: pnpm --filter=pasarelapagos-backend typecheck

      - name: Test + Coverage
        run: pnpm --filter=pasarelapagos-backend test:cov

      # ── pnpm audit ─────────────────────────────────────────────────────────
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      # ── Build Docker ───────────────────────────────────────────────────────
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: pasarelapagos-backend/Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/pasarelapagos-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Trivy — escaneo de vulnerabilidades ────────────────────────────────
      - name: Scan image — Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/pasarelapagos-backend:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # ── Cosign — firma de imagen (supply chain) ────────────────────────────
      - name: Install Cosign
        if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3

      - name: Sign image — Cosign
        if: github.ref == 'refs/heads/main'
        run: cosign sign --yes ghcr.io/${{ github.repository }}/pasarelapagos-backend:${{ github.sha }}
        env: { COSIGN_EXPERIMENTAL: '1' }
