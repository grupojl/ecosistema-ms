syntax = "proto3";

package chatia;

// ─── Servicio Chat IA ──────────────────────────────────────────────────────
// Puerto gRPC interno: 5010
// Usado por: pasarelapagos-backend, futuros microservicios
service ChatIaService {
  // Enviar mensaje a un proyecto de chat
  rpc SendMessage (SendMessageRequest) returns (SendMessageResponse);
  // Consultar estado de un proyecto
  rpc GetProject (GetProjectRequest) returns (GetProjectResponse);
  // Health check inter-servicio
  rpc Ping (PingRequest) returns (PingResponse);
  // Base de conocimiento (FAQ): workers-backend persiste los fragmentos ya vectorizados
  rpc UpsertChunks (UpsertChunksRequest) returns (UpsertChunksResponse);
  // Base de conocimiento (FAQ): workers-backend informa el resultado del procesamiento
  rpc UpdateDocumentStatus (UpdateDocumentStatusRequest) returns (UpdateDocumentStatusResponse);
}

message SendMessageRequest {
  string organization_id = 1;
  string project_slug    = 2;
  string user_id         = 3;
  string message         = 4;
  string channel         = 5; // api | widget | whatsapp | etc.
  string ecosystem_id    = 6;
}

message SendMessageResponse {
  bool   success          = 1;
  string conversation_id  = 2;
  string message_id       = 3;
  string response         = 4;
  string error            = 5;
}

message GetProjectRequest {
  string organization_id = 1;
  string project_slug    = 2;
}

message GetProjectResponse {
  bool   found        = 1;
  string project_id   = 2;
  string name         = 3;
  bool   is_enabled   = 4;
}

message PingRequest  { string caller = 1; }
message PingResponse { string status = 1; string timestamp = 2; }

// ─── Base de conocimiento (FAQ) ────────────────────────────────────────────
// Los vectores deben ser del MISMO modelo con el que chatia consulta (EMBEDDINGS_MODEL, 1024 dims por defecto).
message ChunkInput {
  string         content         = 1;
  repeated float embedding       = 2;
  int32          chunk_index     = 3;
  int32          token_count     = 4;
}

message UpsertChunksRequest {
  string              document_id       = 1;
  string              organization_id   = 2;
  string              knowledge_base_id = 3;
  repeated ChunkInput chunks            = 4;
}

message UpsertChunksResponse {
  bool   success       = 1;
  int32  chunks_stored = 2;
  string error         = 3;
}

message UpdateDocumentStatusRequest {
  string document_id     = 1;
  string organization_id = 2;
  string status          = 3; // INDEXED | FAILED
  int32  chunks_indexed  = 4;
  string error           = 5;
}

message UpdateDocumentStatusResponse {
  bool   success = 1;
  string error   = 2;
}
